spring.application.name=campus-service-tracker
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/campus-tracker;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-characters}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.origins=${FRONTEND_URL:http://localhost:5173,http://192.168.0.101:5173,http://localhost:5174,http://192.168.0.101:5174}
