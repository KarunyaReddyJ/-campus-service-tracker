services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      FRONTEND_URL: http://localhost:5173,http://192.168.0.101:5173,http://localhost:5174,http://192.168.0.101:5174
      JWT_SECRET: change-this-local-development-secret-key
    volumes:
      - campus-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  campus-data:
